name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tox
        run: pipx install tox
      - name: Run linters
        run: tox run -e lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tox
        run: pipx install tox
      - name: Run tests
        run: tox run -e unit

  build:
    strategy:
      matrix:
        path:
          - .
          - tests/integration/app-charm
    name: Build charm | ${{ matrix.path }}
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@3e06c25ea6d5922a25a96d0c7b6a3c7522e65c9a # v54.0.0
    with:
      path-to-charm-directory: ${{ matrix.path }}
      cache: false

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        tox-environments:
          - integration-charm
          - integration-password-rotation
          - integration-provider
          - integration-tls
          - integration-backup
          - integration-replication
          - integration-upgrade

        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm

        exclude:

          # TODO(arm64): Re enable once arm64 released to stable
          - tox-environments: integration-upgrade
            runner: ubuntu-24.04-arm

    name: ${{ matrix.tox-environments }} - ${{ matrix.runner }}
    needs:
      - lint
      - unit-test
      - build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Remove docker
        timeout-minutes: 10
        run: |
          sudo systemctl stop docker.service docker.socket containerd.service
          sudo apt-get purge -y docker-ce docker-ce-cli containerd.io
          sudo ip link delete docker0 || true
          sudo iptables -F
          sudo iptables -t nat -F
          sudo rm -rf /var/lib/docker /var/lib/containerd /etc/docker /var/run/docker.sock
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -F FORWARD

      - name: Setup operator environment
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare --trace --extra-debs pipx
      - name: Install dependencies
        run: |
          pipx install tox
          pipx ensurepath
      - name: Download packed charm(s)
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Select tests
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]
          then
            echo Running unstable and stable tests
            echo "mark_expression=" >> $GITHUB_OUTPUT
          else
            echo Skipping unstable tests
            echo "mark_expression=not unstable" >> $GITHUB_OUTPUT
          fi
      - name: Run integration tests
        run: tox run -e ${{ matrix.tox-environments }} -- -m '${{ steps.select-tests.outputs.mark_expression }}'
        env:
          CI_PACKED_CHARMS: ${{ needs.build.outputs.charms }}

  integration-test-ha:
    strategy:
      fail-fast: false
      matrix:
        tox-environments:
          - integration-ha
    name: ${{ matrix.tox-environments }}
    needs:
      - lint
      - unit-test
      - build
      - integration-test
    runs-on: self-hosted-linux-amd64-noble-large
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup operator environment
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare --trace --extra-debs pipx
      - name: Install dependencies
        run: |
          pipx install tox
          pipx ensurepath
      - name: Download packed charm(s)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Select tests
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]
          then
            echo Running unstable and stable tests
            echo "mark_expression=" >> $GITHUB_OUTPUT
          else
            echo Skipping unstable tests
            echo "mark_expression=not unstable" >> $GITHUB_OUTPUT
          fi
      - name: Run integration tests
        run: tox run -e ${{ matrix.tox-environments }} -- -m '${{ steps.select-tests.outputs.mark_expression }}' --keep-models
        env:
          CI_PACKED_CHARMS: ${{ needs.build.outputs.charms }}
